services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: divinglog
      POSTGRES_USER: divinglog
      POSTGRES_PASSWORD: divinglog_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U divinglog -d divinglog"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://divinglog:divinglog_password@db:5432/divinglog
      SECRET_KEY: change-this-to-a-long-random-secret-before-use
      UPLOAD_DIR: /data/uploads
      UPLOAD_STORAGE_BACKEND: local
      LOG_DIR: /data/logs
      LOG_LEVEL: INFO
      TRUSTED_HOSTS: localhost,127.0.0.1
      SESSION_HTTPS_ONLY: "false"
      FORCE_HTTPS: "false"
      ALLOW_REGISTRATION: "true"
      RUN_STARTUP_MAINTENANCE: "false"
      BOOTSTRAP_ADMIN_USERNAME: admin
      BOOTSTRAP_ADMIN_PASSWORD: change-this-admin-password
    volumes:
      - upload-data:/data/uploads
      - app-logs:/data/logs
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"

volumes:
  postgres-data:
  upload-data:
  app-logs:
