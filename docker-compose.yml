services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-divinglog}
      POSTGRES_USER: ${POSTGRES_USER:-divinglog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 환경변수를 설정하세요}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U divinglog -d divinglog"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL 환경변수를 설정하세요}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY 환경변수를 설정하세요}
      UPLOAD_DIR: /data/uploads
      UPLOAD_STORAGE_BACKEND: local
      LOG_DIR: /data/logs
      LOG_LEVEL: INFO
      TRUSTED_HOSTS: localhost,127.0.0.1
      SESSION_HTTPS_ONLY: "false"
      FORCE_HTTPS: "false"
      ALLOW_REGISTRATION: "true"
      RUN_STARTUP_MAINTENANCE: "false"
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?BOOTSTRAP_ADMIN_PASSWORD 환경변수를 설정하세요}
    volumes:
      - upload-data:/data/uploads
      - app-logs:/data/logs
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"

volumes:
  postgres-data:
  upload-data:
  app-logs:
