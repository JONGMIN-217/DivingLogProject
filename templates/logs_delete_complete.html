{% extends "base.html" %}

{% block content %}
<style>
.delete-complete {
    max-width: 640px;
    margin: 40px auto;
    padding: 24px;
    border: 1px solid #ddd;
    border-radius: 8px;
    background: #fff;
}

.delete-complete h2 {
    margin-top: 0;
}

.result-list {
    display: grid;
    gap: 10px;
    margin: 20px 0;
}

.result-row {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    padding: 10px 0;
    border-bottom: 1px solid #eee;
}

.result-label {
    color: #666;
}

.result-value {
    font-weight: 700;
}

.complete-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.btn {
    display: inline-block;
    box-sizing: border-box;
    padding: 8px 12px;
    border: 1px solid #bbb;
    border-radius: 6px;
    background: #fff;
    color: #222;
    font: inherit;
    text-decoration: none;
    cursor: pointer;
}

.btn-primary {
    border-color: #2364d2;
    background: #2364d2;
    color: #fff;
}
</style>

<section class="delete-complete">
    <h2>삭제가 완료되었습니다.</h2>

    <div class="result-list">
        <div class="result-row">
            <span class="result-label">삭제 유형</span>
            <span class="result-value">{{ delete_type }}</span>
        </div>
        <div class="result-row">
            <span class="result-label">삭제된 로그 수</span>
            <span class="result-value">{{ deleted_count }}개</span>
        </div>
        <div class="result-row">
            <span class="result-label">남은 로그 수</span>
            <span class="result-value">{{ remaining_count }}개</span>
        </div>
    </div>

    <div class="complete-actions">
        <a class="btn btn-primary" href="/logs">전체 로그 확인</a>
        <a class="btn" href="/">홈으로 이동</a>
    </div>
</section>
{% endblock %}
