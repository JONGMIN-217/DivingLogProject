<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>All Logs</title>
</head>

<body>
<div style="margin-bottom:20px;">
<a href="/"><button>Home</button></a>
<a href="/map"><button>Map</button></a>
<a href="/logs"><button>Logs</button></a>
<a href="/log/add"><button>Add Log</button></a>
</div>
<h2>전체 다이빙 로그</h2>

<table border="1">

<tr>
<th>Dive #</th>
<th>Date</th>
<th>Depth</th>
<th>Time</th>
</tr>

{% for log in logs %}

<tr>

<td>
<a href="/log/{{ log.id }}">
#{{ log.id }}
</a>
</td>

<td>
{{ log.dive_date }}
</td>

<td>
{{ log.max_depth }} m
</td>

<td>
{{ log.dive_time }} min
</td>

</tr>

{% endfor %}

</table>

<br>

<a href="/">메인으로</a>

</body>
</html>
