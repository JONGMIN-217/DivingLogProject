{% extends "base.html" %}

{% block head %}
<style>
.backup-page {
    max-width: 980px;
}
.backup-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 16px;
}
.backup-card {
    border: 1px solid #ddd;
    border-radius: 8px;
    background: #fff;
    padding: 18px;
}
.backup-card h3 {
    margin-top: 0;
}
.form-field {
    margin-bottom: 12px;
}
.form-field label {
    display: block;
    margin-bottom: 6px;
    color: #555;
    font-size: 14px;
}
.form-field select,
.form-field input[type="file"] {
    box-sizing: border-box;
    width: 100%;
    padding: 8px;
    border: 1px solid #bbb;
    border-radius: 6px;
    font: inherit;
}
.check-field {
    display: flex;
    align-items: center;
    gap: 8px;
}
.btn {
    display: inline-block;
    box-sizing: border-box;
    padding: 8px 12px;
    border: 1px solid #bbb;
    border-radius: 6px;
    background: #fff;
    color: #222;
    font: inherit;
    text-decoration: none;
    cursor: pointer;
}
.btn-primary {
    border-color: #2364d2;
    background: #2364d2;
    color: #fff;
}
.warning-box {
    border: 1px solid #f59e0b;
    border-radius: 8px;
    background: #fffbeb;
    padding: 12px;
    color: #92400e;
    font-size: 14px;
}
</style>
{% endblock %}

{% block content %}
<div class="backup-page">
    <h2>백업 및 복구</h2>
    <p>다이빙 로그, 포인트, 프로파일, 사용자 설정, 친구, 투어, Import 기록을 JSON 또는 ZIP 파일로 백업하고 복구합니다.</p>

    <div class="backup-grid">
        <section class="backup-card">
            <h3>백업 다운로드</h3>
            <form action="/account/backup/download" method="get">
                <div class="form-field">
                    <label for="backup_format">백업 형식</label>
                    <select id="backup_format" name="backup_format">
                        <option value="json">JSON</option>
                        <option value="zip">ZIP</option>
                    </select>
                </div>
                <div class="form-field">
                    <label for="download_scope">백업 범위</label>
                    <select id="download_scope" name="scope">
                        <option value="user">내 데이터</option>
                        {% if is_admin %}
                        <option value="all">전체 데이터</option>
                        {% endif %}
                    </select>
                </div>
                <div class="form-field check-field">
                    <input type="checkbox" id="include_photos" name="include_photos" value="1">
                    <label for="include_photos">ZIP 백업에 사진 파일 포함</label>
                </div>
                <button class="btn btn-primary" type="submit">백업 다운로드</button>
            </form>
        </section>

        <section class="backup-card">
            <h3>복구</h3>
            <div class="warning-box">
                복구 전 반드시 미리보기를 확인하세요. 같은 ID의 데이터는 갱신되고, 없는 데이터는 추가됩니다.
            </div>
            <form action="/account/backup/restore-preview" method="post" enctype="multipart/form-data">
                <div class="form-field">
                    <label for="backup_file">백업 파일</label>
                    <input type="file" id="backup_file" name="backup_file" accept=".json,.zip" required>
                </div>
                <div class="form-field">
                    <label for="restore_scope">복구 범위</label>
                    <select id="restore_scope" name="scope">
                        <option value="user">내 데이터만 복구</option>
                        {% if is_admin %}
                        <option value="all">전체 데이터 복구</option>
                        {% endif %}
                    </select>
                </div>
                <button class="btn btn-primary" type="submit">복구 미리보기</button>
            </form>
        </section>
    </div>
</div>
{% endblock %}
