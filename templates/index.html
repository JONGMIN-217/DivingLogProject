{% extends "base.html" %}

{% block content %}

<h2>Diving Log Map</h2>

<div id="map"></div>

<style>
#map{
    height: 600px;
    width: 100%;
}
</style>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([33.24, 126.56], 11);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18
}).addTo(map);

async function loadPoints(){

    const res = await fetch("/divepoints");
    const points = await res.json();

    points.forEach(p => {

        if(p.latitude && p.longitude){

            const marker = L.marker([p.latitude, p.longitude]).addTo(map);

            marker.on("click", () => {
                window.location.href = `/point/${p.id}/logs`;
            });

        }

    });

}

loadPoints();

</script>

{% endblock %}
