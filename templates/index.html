{% extends "base.html" %}

{% block content %}

<h2>다이빙 로그 지도</h2>

<div id="map"></div>

<style>
#map{
    height: 600px;
    width: 100%;
}

.point-popup{
    min-width: 180px;
}

.point-popup__title{
    margin: 0 0 8px;
    font-size: 16px;
    font-weight: 700;
}

.point-popup__meta{
    display: grid;
    gap: 4px;
    margin-bottom: 10px;
    color: #333;
}

.point-popup__marine{
    display: grid;
    gap: 4px;
    margin: 10px 0;
    padding: 8px;
    border: 1px solid #e5e7eb;
    border-radius: 6px;
    background: #f8fafc;
    font-size: 13px;
}

.point-popup__button{
    width: 100%;
    padding: 7px 10px;
    border: none;
    border-radius: 4px;
    background: #0d6efd;
    color: #fff;
    font-weight: 700;
    cursor: pointer;
}

.point-popup__button:hover{
    background: #0b5ed7;
}
</style>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([33.24, 126.56], 11);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18
}).addTo(map);

function formatDiveDate(dateText){
    if(!dateText){
        return "기록 없음";
    }

    const date = new Date(dateText);
    if(Number.isNaN(date.getTime())){
        return dateText;
    }

    return date.toLocaleDateString("ko-KR", {
        year: "numeric",
        month: "long",
        day: "numeric"
    });
}

function createPointPopup(point){
    const container = document.createElement("div");
    container.className = "point-popup";

    const title = document.createElement("h3");
    title.className = "point-popup__title";
    title.textContent = point.name || "이름 없는 포인트";

    const meta = document.createElement("div");
    meta.className = "point-popup__meta";

    const logCount = document.createElement("div");
    logCount.textContent = `로그 개수: ${point.log_count || 0}개`;

    const latestDiveDate = document.createElement("div");
    latestDiveDate.textContent = `최근 다이빙 날짜: ${formatDiveDate(point.latest_dive_date)}`;

    const marine = document.createElement("div");
    marine.className = "point-popup__marine";
    marine.dataset.marinePointId = point.id;
    marine.textContent = "해양 정보를 불러오는 중입니다.";

    const button = document.createElement("button");
    button.type = "button";
    button.className = "point-popup__button";
    button.textContent = "로그 보기";
    button.addEventListener("click", () => {
        window.location.href = `/point/${point.id}/logs`;
    });

    meta.append(logCount, latestDiveDate);
    container.append(title, meta, marine, button);

    return container;
}

function formatMarineValue(value, unit){
    return value === null || value === undefined ? "-" : `${value}${unit}`;
}

function loadPopupMarineInfo(pointId, popupNode){
    const marineNode = popupNode.querySelector("[data-marine-point-id]");
    if(!marineNode || marineNode.dataset.loaded === "1"){
        return;
    }
    marineNode.dataset.loaded = "1";

    fetch(`/api/points/${pointId}/marine`)
        .then(response => response.ok ? response.json() : { ok: false })
        .then(payload => {
            if(!payload.ok){
                marineNode.textContent = payload.message || "해양 정보 조회 실패";
                return;
            }
            const marine = payload.marine || {};
            marineNode.innerHTML = `
                <div>파고: ${formatMarineValue(marine.wave_height, " m")}</div>
                <div>파주기: ${formatMarineValue(marine.wave_period, " 초")}</div>
                <div>파향: ${formatMarineValue(marine.wave_direction, "°")}</div>
                <div>해수면 수온: ${formatMarineValue(marine.sea_surface_temperature, " ℃")}</div>
            `;
        })
        .catch(() => {
            marineNode.textContent = "해양 정보 조회 실패";
        });
}

async function loadPoints(){

    const res = await fetch("/divepoints");
    const points = await res.json();

    points.forEach(p => {

        if(p.latitude !== null && p.longitude !== null){

            const marker = L.marker([p.latitude, p.longitude]).addTo(map);
            marker.bindPopup(createPointPopup(p));
            marker.on("popupopen", event => {
                loadPopupMarineInfo(p.id, event.popup.getElement());
            });

        }

    });

}

loadPoints();

</script>

{% endblock %}
