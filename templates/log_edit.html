{% extends "base.html" %}

{% block content %}

<h2>다이빙 로그 수정 Dive #{{ log.dive_number or log.id }}</h2>

<form action="/log/{{ log.id }}/edit" method="post">

포인트<br>
<select name="dive_point_id">
{% for p in points %}
<option value="{{ p.id }}"
{% if p.id == log.dive_point_id %}
selected
{% endif %}
>
{{ p.name }}
</option>
{% endfor %}
</select>

<br><br>

날짜<br>
<input type="date" name="dive_date" value="{{ log.dive_date }}">

<br><br>

최대수심<br>
<input type="number" step="0.1" name="max_depth" min="0" value="{{ log.max_depth }}">

<br><br>

평균수심<br>
<input type="number" step="0.1" name="avg_depth" min="0" value="{{ log.avg_depth }}">

<br><br>

입수시간<br>
<input type="time" name="entry_time" id="startTime" value="{{ log.entry_time.strftime('%H:%M') if log.entry_time else '' }}">

<br><br>

출수시간<br>
<input type="time" name="exit_time" id="endTime" value="{{ log.exit_time.strftime('%H:%M') if log.exit_time else '' }}">

<br><br>

다이브타임<br>
<input type="number" name="dive_time" id="diveTime" value="{{ log.dive_time }}">

<br><br>

수온<br>
<input type="number" step="0.1" name="water_temp" value="{{ log.water_temp }}">

<br><br>

시야<br>
<select name="visibility">
<option value="1" {% if log.visibility == 1 %}selected{% endif %}>★</option>
<option value="2" {% if log.visibility == 2 %}selected{% endif %}>★★</option>
<option value="3" {% if log.visibility == 3 %}selected{% endif %}>★★★</option>
<option value="4" {% if log.visibility == 4 %}selected{% endif %}>★★★★</option>
<option value="5" {% if log.visibility == 5 %}selected{% endif %}>★★★★★</option>
</select>

<br><br>

버디<br>
<input type="text" name="buddy" id="buddy" list="buddySuggestions" autocomplete="off" value="{{ log.buddy or '' }}" placeholder="친구 이름 또는 버디 이름 입력">
<input type="hidden" name="buddy_user_id" id="buddyUserId" value="{{ log.buddy_user_id or '' }}">
<datalist id="buddySuggestions">
{% for friend in friends %}
<option value="{% if friend.nickname and friend.nickname != friend.username %}{{ friend.nickname }} ({{ friend.username }}){% else %}{{ friend.username }}{% endif %}" data-user-id="{{ friend.id }}"></option>
{% endfor %}
</datalist>

<br><br>

입수잔압 (bar)<br>
<input type="number" name="start_pressure" value="{{ log.start_pressure }}">

<br><br>

출수잔압 (bar)<br>
<input type="number" name="end_pressure" value="{{ log.end_pressure }}">

<br><br>

메모<br>
<textarea name="note">{{ log.note }}</textarea>

<br><br>

<button type="submit">수정 저장</button>

</form>

<br>

<a href="/log/{{ log.id }}"><button>상세 보기</button></a>
<a href="/logs"><button>전체 로그</button></a>

<script>
function calculateDiveTime(){
 const start=document.getElementById("startTime").value
 const end=document.getElementById("endTime").value

 if(!start || !end) return

 const s=new Date(`1970-01-01T${start}:00`)
 const e=new Date(`1970-01-01T${end}:00`)

 const diff=(e-s)/60000

 if(diff>=0){
  document.getElementById("diveTime").value=diff
 }
}

function calculateEndTime(){
 const start=document.getElementById("startTime").value
 const diveTime=document.getElementById("diveTime").value

 if(!start || !diveTime) return

 const s=new Date(`1970-01-01T${start}:00`)
 s.setMinutes(s.getMinutes()+parseInt(diveTime))

 const h=String(s.getHours()).padStart(2,'0')
 const m=String(s.getMinutes()).padStart(2,'0')

 document.getElementById("endTime").value=`${h}:${m}`
}

document.getElementById("endTime").addEventListener("change",calculateDiveTime)
document.getElementById("diveTime").addEventListener("change",calculateEndTime)

const buddyInput=document.getElementById("buddy")
const buddyUserId=document.getElementById("buddyUserId")
const buddyOptions=Array.from(document.querySelectorAll("#buddySuggestions option"))
buddyInput.addEventListener("input", function(){
 const matched=buddyOptions.find(option => option.value === this.value)
 buddyUserId.value=matched ? matched.dataset.userId : ""
})
</script>

{% endblock %}
